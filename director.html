<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetmen | Emre Bostanoğlu</title>
    <link rel="icon" type="image/png" href="https://static.fokusistatistik.com/resimler/ebfavicon.png">
    <link rel="apple-touch-icon" href="https://static.fokusistatistik.com/resimler/ebfavicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c3335">
    <meta name="description" content="Emre Bostanoğlu film projeleri ve senaryoları. Kısa filmler, belgeseller ve video art çalışmaları.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Components JS -->
    <!-- i18n System (must load before components) -->
    <script src="js/i18n.js"></script>

    <script src="js/components.js"></script>

    <style>
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .video-card {
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-8px);
        }

        .video-info {
            background: linear-gradient(135deg, #343a40 0%, #2c3335 100%);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
            border-left: 4px solid #e50914;
            transition: all 0.3s ease;
        }

        .video-card:hover .video-info {
            border-left-color: #ff1a1a;
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.2);
        }

        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(229, 9, 20, 0.2);
            color: #e50914;
            border: 1px solid rgba(229, 9, 20, 0.4);
        }

        .video-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .video-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-description {
            color: #d1d5db;
            line-height: 1.6;
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .video-info {
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-300 font-sans antialiased selection:bg-director-red selection:text-white">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="relative py-32 bg-dark-bg border-b border-gray-800 pt-32">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <span class="text-director-red font-bold tracking-[0.3em] text-sm uppercase mb-4 block">Sinematografi</span>
            <h1 class="text-4xl md:text-6xl font-cinzel text-white font-bold mb-6">Vizörün Arkası</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">
                Hareketli görüntülerle anlatılan hikayeler. Kurgu, belgesel ve deneysel sinema çalışmaları.
            </p>
        </div>
    </section>

    <!-- Videos Grid -->
    <section class="py-20 bg-dark-bg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="videos-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- Videos will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Initialize Components -->
    <script>
        loadComponents('director');
    </script>

    <!-- Video Gallery Script -->
    <script>
        // Video data structure - User will provide YouTube IDs and details
        const videos = [
            {
                id: 1,
                youtubeId: 'dQw4w9WgXcQ', // PLACEHOLDER - Replace with actual YouTube ID
                title: 'Film Başlığı 1',
                description: 'Film açıklaması buraya gelecek. Kullanıcı gerçek bilgileri sağlayacak.',
                category: 'Kısa Film', // Options: Kısa Film, Belgesel, Video Art, Deneysel
                year: '2024',
                duration: '12:30'
            },
            {
                id: 2,
                youtubeId: 'dQw4w9WgXcQ', // PLACEHOLDER
                title: 'Film Başlığı 2',
                description: 'Film açıklaması buraya gelecek. Kullanıcı gerçek bilgileri sağlayacak.',
                category: 'Belgesel',
                year: '2023',
                duration: '25:45'
            },
            {
                id: 3,
                youtubeId: 'dQw4w9WgXcQ', // PLACEHOLDER
                title: 'Film Başlığı 3',
                description: 'Film açıklaması buraya gelecek. Kullanıcı gerçek bilgileri sağlayacak.',
                category: 'Video Art',
                year: '2023',
                duration: '8:15'
            },
            {
                id: 4,
                youtubeId: 'dQw4w9WgXcQ', // PLACEHOLDER
                title: 'Film Başlığı 4',
                description: 'Film açıklaması buraya gelecek. Kullanıcı gerçek bilgileri sağlayacak.',
                category: 'Kısa Film',
                year: '2022',
                duration: '15:20'
            }
            // Add more videos (up to 6-8 total)
        ];

        // Generate video cards
        function generateVideoGallery() {
            const grid = document.getElementById('videos-grid');
            grid.innerHTML = '';

            videos.forEach(video => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';

                videoCard.innerHTML = `
                    <!-- Video Player -->
                    <div class="video-container">
                        <iframe
                            src="https://www.youtube.com/embed/${video.youtubeId}?rel=0&modestbranding=1"
                            title="${video.title}"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen
                            loading="lazy">
                        </iframe>
                    </div>

                    <!-- Video Info -->
                    <div class="video-info">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex-1">
                                <span class="category-badge">${video.category}</span>
                                <h3 class="text-white font-cinzel text-2xl mt-2 mb-1">${video.title}</h3>
                            </div>
                        </div>

                        <div class="video-meta">
                            <div class="video-meta-item">
                                <i class="fas fa-calendar text-director-red"></i>
                                <span>${video.year}</span>
                            </div>
                            <div class="video-meta-item">
                                <i class="fas fa-clock text-director-red"></i>
                                <span>${video.duration}</span>
                            </div>
                        </div>

                        <p class="video-description">${video.description}</p>

                        <!-- Share Buttons -->
                        <div class="border-t border-gray-700 pt-4 mt-4">
                            <div id="share-video-${video.id}"></div>
                        </div>
                    </div>
                `;

                grid.appendChild(videoCard);

                // Load share buttons for this video
                setTimeout(() => {
                    loadShareButtons(`share-video-${video.id}`, {
                        url: `https://www.youtube.com/watch?v=${video.youtubeId}`,
                        title: `${video.title} - Emre Bostanoğlu`,
                        description: video.description,
                        layout: 'horizontal',
                        showLabels: false
                    });
                }, 100);
            });
        }

        // Initialize gallery
        generateVideoGallery();
    </script>

    <!-- Interactive Features -->
    <script src="js/chatbot.js"></script>
    <script src="js/exit-intent.js"></script>

    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((reg) => console.log('SW registered', reg.scope)).catch((err) => console.log('SW failed', err));
            });
        }
    </script>

</body>
</html>
