    <style>
        .article-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3335 100%);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-color: #444;
        }

        .article-image-container {
            position: relative;
            width: 280px;
            min-width: 280px;
            height: 240px;
            overflow: hidden;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .article-card {
                flex-direction: column;
            }

            .article-image-container {
                width: 100%;
                min-width: 100%;
                height: 200px;
            }
        }

        .article-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .article-card:hover .article-image {
            transform: scale(1.1);
        }

        .video-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: white;
            opacity: 0.8;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .article-card:hover .video-overlay {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .article-type-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            font-size: 0.875rem;
        }

        .article-content {
            padding: 1.5rem;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .article-category {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .article-date {
            color: #9ca3af;
        }

        .article-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.75rem;
            font-family: 'Cinzel', serif;
            line-height: 1.3;
        }

        .article-excerpt {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .article-footer {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid #333;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .article-author,
        .article-read-time,
        .article-duration {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .article-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .article-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .category-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            background: transparent;
            border: 2px solid #444;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .category-btn:hover {
            border-color: var(--category-color, #3b82f6);
            color: var(--category-color, #3b82f6);
            background: rgba(59, 130, 246, 0.1);
        }

        .category-btn.active {
            background: var(--category-color, #3b82f6);
            color: white;
            border-color: var(--category-color, #3b82f6);
        }

        .no-content {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
        }

        @media (max-width: 768px) {
            .article-card-featured {
                grid-column: span 1;
            }

            .article-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-300 font-sans antialiased selection:bg-data-blue selection:text-white">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="relative py-12 bg-dark-bg border-b border-gray-800 pt-24">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <span class="text-data-blue font-bold tracking-[0.3em] text-sm uppercase mb-2 block">İçerikler</span>
            <h1 class="text-4xl md:text-6xl font-cinzel text-white font-bold mb-2">Blog & Makaleler</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">
                Veri bilimi, fotoğraf sanatı, edebiyat ve sinema üzerine yazılar, videolar ve güncellemeler.
            </p>
        </div>
    </section>

    <!-- Category Filter -->
    <section class="py-12 bg-dark-bg border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="category-filter" class="flex flex-wrap justify-center gap-4">
                <!-- Categories will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Content List -->
    <section class="py-20 bg-dark-bg">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="blog-list" class="space-y-8">
                <!-- Blog posts will be dynamically loaded here by blog-renderer.js -->
                <div class="text-center py-16">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-600 mb-4"></i>
                    <p class="text-gray-400">Blog yazıları yükleniyor...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Blog System Modules -->
    <script src="js/blog-data.js?v=2.0"></script>
    <script src="js/blog-renderer.js"></script>

    <!-- Interactive Features -->
    <script src="js/chatbot-ui.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/exit-intent.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/legal-modal.js"></script>

    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((reg) => console.log('SW registered', reg.scope)).catch((err) => console.log('SW failed', err));
            });
        }
    </script>

</body>
